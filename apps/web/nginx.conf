# REEP web — the single front door (the `web` service in docker-compose.prod.yml).
#
# The SPA and the API MUST be same-origin: the session is an httpOnly
# SameSite=Lax cookie, so a cross-origin API call would simply never carry it —
# every login would "succeed" and then behave as logged-out. In development the
# Angular dev server's proxy.conf.json provides that one origin; in production
# NOTHING did, and this file is the fix: static Angular files from disk,
# everything under /api proxied to the api service, one origin either way.
#
# Included at http{} level from /etc/nginx/conf.d/, replacing the stock
# default.conf — the stock nginx.conf's sendfile/keepalive defaults still apply,
# so only what differs is stated here.

# WebSocket upgrade plumbing: Connection must say "upgrade" only when the client
# actually asked for one, and stay a normal keep-alive/close header otherwise.
# The map keys on what the client sent, so both cases share the proxy blocks.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # TLS TERMINATES HERE, and must before real students sign in: ENV=prod
    # marks the session cookie Secure, and a Secure cookie is silently dropped
    # over plain HTTP — authentication breaks in a way that looks like a
    # backend bug (docs/deployment-env.md). Enable the 443 server block at the
    # bottom of this file, and the 443 port + certificate mount the `web`
    # service in docker-compose.prod.yml keeps commented next to its ports.

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text. The compiled bundles compress roughly 4:1; images and woff2
    # are already compressed and are deliberately not listed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Uploads are capped at 10 MB server-side; 12m leaves room for the
    # multipart envelope without letting nginx buffer arbitrarily large bodies
    # the api would only refuse anyway.
    client_max_body_size 12m;

    # Response hardening for everything this server serves itself (the API
    # stamps its own copies in app/main.py, so proxied /api responses carry
    # them either way). NGINX GOTCHA, and why these lines appear again below:
    # add_header is NOT additive across levels — any location that declares its
    # own add_header (the two Cache-Control ones) silently discards every
    # header inherited from here, so each of those must restate the pair.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ---- The interview WebSocket, matched exactly and before /api/. ---------
    # One interview is a single WebSocket held open for up to 15 minutes
    # (interview_max_seconds = 900), with long silences inside it — a student
    # thinking is not a dead peer. 3600s so this proxy is never the party that
    # hangs up mid-interview; every real timeout (idle, max-seconds, transcript
    # deadline) is owned by the relay, which closes with a code the client can
    # explain. An exact match, so the general /api/ timeout below cannot creep
    # onto this path.
    location = /api/interview {
        proxy_pass http://api:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Everything else under /api → the api service, path preserved. ------
    # proxy_pass with NO trailing URI, so /api/... arrives upstream as /api/...
    # — the whole client surface lives under /api (AGENTS.md) and the api's own
    # routes include the prefix. `^~` so no regex location (the hashed-asset one
    # below) can ever shadow an API path that happens to end in .js.
    location ^~ /api/ {
        proxy_pass http://api:3300;
        proxy_http_version 1.1;
        # uvicorn runs --proxy-headers: these are what it reads to see the real
        # client address and scheme instead of this proxy's.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Unbuffered, or /api/agent/chat/stream's SSE deltas sit in a proxy
        # buffer until the response ends — streaming that does not stream.
        proxy_buffering off;
        # Generous but bounded: an LLM-backed answer can take tens of seconds;
        # a one-hour hold does not belong on ordinary requests.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Hashed bundles: cache forever. -------------------------------------
    # `ng build` (outputHashing: all) names every emitted js/css
    # `<name>-<HASH8>.<ext>`, so a changed file is a changed URL and immutable
    # is safe. Assets copied verbatim from public/ are UNhashed, deliberately do
    # not match this pattern, and fall through to the default caching below.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Restated: this location's add_header discards the server-level pair.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html is the one unhashed entry point and must never be cached: a
    # stale copy pins a student to bundle URLs that stop existing at the next
    # deploy, which presents as a blank page until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Restated: this location's add_header discards the server-level pair.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # ---- SPA fallback. ------------------------------------------------------
    # Angular's routes (/student/assistant, /mentor/..., ...) exist only in the
    # browser. A deep link or a refresh must be answered with index.html and
    # let the router take over — =404 here would break every bookmarked page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- TLS server block — enable together with the compose port/cert mount. ----
# Kept as close to the :80 block as a comment can be, so enabling HTTPS is an
# uncomment-and-fill exercise rather than a design session under incident
# pressure. Once live, turn the :80 server above into a 301 → https redirect.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name _;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#
#     # HSTS belongs here and only here — a Strict-Transport-Security header
#     # served over plain HTTP is ignored by browsers, and pinning localhost
#     # would be actively harmful. (The API sets its own copy outside the dev
#     # allowlist; this covers the SPA's files.)
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ...then repeat (or move) every location block from the :80 server here.
#     # $scheme becomes https, which uvicorn's --proxy-headers passes to the
#     # app — that is what lets the Secure session cookie survive.
# }
