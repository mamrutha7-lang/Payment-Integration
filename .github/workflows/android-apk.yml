# Build the REEP Android app (a debug APK) from the browser — no Android
# Studio needed.
#
# HOW TO USE IT: GitHub -> Actions -> "Android APK (debug)" -> Run workflow.
# Pick the branch, type your REEP server address (for example
# https://reep.example.edu) and press the green button. When it finishes
# (about 10 minutes), open the run and download "reep-debug-apk" at the
# bottom. Unzip it, copy app-debug.apk to your phone and open it there.
# docs/mobile-app.md explains every step.
#
# WHAT IT IS NOT. It is not a sixth CI job and must not become one:
# tests/test_codebase_guards.py §34 pins ci.yml's five job names against the
# ruleset, and a required check nobody triggers can never report. It runs
# only when somebody presses the button. It holds no secret and no AWS
# credential, and the APK it makes is a DEBUG build, signed with a throwaway
# key: fine for testing on your own phone, not for the Play Store.

name: Android APK (debug)

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "REEP server address the app talks to, https://..., no trailing slash"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Capacitor 8's Android project needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the server address
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          case "$API_ORIGIN" in
            https://*) ;;
            *) echo "::error::api_origin must start with https:// (Android blocks plain http from the app)"; exit 1 ;;
          esac
          case "$API_ORIGIN" in
            */) echo "::error::api_origin must not end with /"; exit 1 ;;
            *\'*|*\ *) echo "::error::api_origin must be a plain address"; exit 1 ;;
          esac

      - name: Install
        run: npm ci

      - name: Point the app at the server
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          sed -i "s#apiOrigin: ''#apiOrigin: '${API_ORIGIN}'#" src/environments/native.ts
          grep -q "apiOrigin: '${API_ORIGIN}'" src/environments/native.ts

      - name: Build the website files
        run: npx ng build

      - name: Copy them into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: reep-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
